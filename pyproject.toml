[project]
name = "enterprise-web-scraper"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5.0",
    "pandas>=2.0,<3.0",
    "requests>=2.31,<3.0",
    "tenacity>=8.2,<9.0",
    "rich>=13.0,<14.0",
]

[project.scripts]
scrape = "enterprise_web_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_web_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "responses>=0.25",
]
